services:
  mysql:
    image: mysql:8.4
    container_name: ornably-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_SCHEMA}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - ../data:/var/lib/mysql
      - ../../src/main/resources/SQL/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../src/main/resources/SQL/sample.sql:/docker-entrypoint-initdb.d/02-sample-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: ornably-redis
    restart: unless-stopped
    volumes:
      - ornably-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: hurwan0629/ornably-hurwan:latest
    build:
      context: ../../
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    volumes:
      - ../../resource:/app/resource
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  ornably-redis-data:
