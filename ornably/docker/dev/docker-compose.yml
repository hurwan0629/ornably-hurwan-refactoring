services:
  mysql:
    image: mysql:8.4
    container_name: ornably-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: kevin
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - ../data:/var/lib/mysql
      - ../../src/main/resources/SQL/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../src/main/resources/SQL/sample.sql:/docker-entrypoint-initdb.d/02-sample-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: ornably-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ornably-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ornably-redis-data:
